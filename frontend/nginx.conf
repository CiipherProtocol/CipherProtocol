server {
  listen 80;
  root /usr/share/nginx/html;

  # Re-resolve the backend through Docker's DNS instead of pinning the IP
  # it had at startup; otherwise every backend restart breaks /api with 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:5001;

  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Single-page app: unknown paths serve index.html.
  location / {
    try_files $uri /index.html;
  }
}
